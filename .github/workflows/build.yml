name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android lisanslarını kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/koppiy.keystore
            echo "İmza anahtarı bulundu."
          else
            echo "KEYSTORE_B64 secret'ı yok, varsayılan imza kullanılacak."
          fi

      - name: Derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: APK'yı Koppiy.apk olarak adlandır
        run: cp app/build/outputs/apk/debug/*.apk Koppiy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Koppiy-APK
          path: Koppiy.apk

      - name: Releases'a yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Koppiy (en güncel)
          body: En güncel Koppiy APK'sı. Kurulum için README'ye bak.
          files: Koppiy.apk
